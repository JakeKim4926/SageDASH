<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGEDash Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stat-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    background: var(--accent-light);
    color: var(--accent);
  }

  .stat-body {}

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
</style>
</head>
<body>

<div class="page-header">
  <span class="page-title"><span class="accent-bar"></span>Dashboard</span>
  <span class="page-status" id="statusText">Waiting for data...</span>
</div>

<div id="emptyState" class="empty-state">
  No data loaded. Open a file to view the dashboard.
</div>

<div id="mainContent" style="display:none;">

  <!-- KPI 카드 -->
  <div class="kpi-grid">
    <div class="kpi-card accent">
      <div class="kpi-label">Rows</div>
      <div class="kpi-value" id="kpiRows">—</div>
      <div class="kpi-sub">data records</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">Columns</div>
      <div class="kpi-value" id="kpiCols">—</div>
      <div class="kpi-sub">fields</div>
    </div>
    <div class="kpi-card accent">
      <div class="kpi-label">File</div>
      <div class="kpi-value" style="font-size:13px;" id="kpiFile">—</div>
      <div class="kpi-sub">source</div>
    </div>
  </div>

  <hr class="divider">

  <!-- 통계 카드 -->
  <div class="section-label">Summary</div>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon">📄</div>
      <div class="stat-body">
        <div class="stat-label">File Name</div>
        <div class="stat-value" id="statFileName">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⚡</div>
      <div class="stat-body">
        <div class="stat-label">Total Cells</div>
        <div class="stat-value" id="statTotalCells">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">↕</div>
      <div class="stat-body">
        <div class="stat-label">Total Rows</div>
        <div class="stat-value" id="statRows">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">↔</div>
      <div class="stat-body">
        <div class="stat-label">Total Columns</div>
        <div class="stat-value" id="statCols">—</div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- 파일 정보 테이블 -->
  <div class="section-label">File Info</div>
  <table class="info-table">
    <tr>
      <td class="label-col">File Name</td>
      <td class="value-col" id="infoFileName">—</td>
    </tr>
    <tr>
      <td class="label-col">Total Rows</td>
      <td class="value-col" id="infoRows">—</td>
    </tr>
    <tr>
      <td class="label-col">Total Columns</td>
      <td class="value-col" id="infoCols">—</td>
    </tr>
    <tr>
      <td class="label-col">Total Cells</td>
      <td class="value-col" id="infoCells">—</td>
    </tr>
  </table>

</div>

<script src="bridge.js"></script>
<script>
  function updateDashboard(payload) {
    var rows  = payload.rowCount;
    var cols  = payload.colCount;
    var file  = payload.fileName || '—';
    var cells = rows * cols;

    document.getElementById('kpiRows').textContent = rows.toLocaleString();
    document.getElementById('kpiCols').textContent = cols.toLocaleString();
    document.getElementById('kpiFile').textContent = file;

    document.getElementById('statFileName').textContent  = file;
    document.getElementById('statTotalCells').textContent = cells.toLocaleString();
    document.getElementById('statRows').textContent      = rows.toLocaleString();
    document.getElementById('statCols').textContent      = cols.toLocaleString();

    document.getElementById('infoFileName').textContent = file;
    document.getElementById('infoRows').textContent     = rows.toLocaleString();
    document.getElementById('infoCols').textContent     = cols.toLocaleString();
    document.getElementById('infoCells').textContent    = cells.toLocaleString();

    document.getElementById('statusText').textContent       = 'Data loaded';
    document.getElementById('emptyState').style.display     = 'none';
    document.getElementById('mainContent').style.display    = 'block';
  }

  SageBridge.on('native:ready', function() {
    SageBridge.send('web:request-summary', {});
  });

  SageBridge.on('data:summary', function(payload) {
    updateDashboard(payload);
  });

  document.getElementById('emptyState').style.display = 'block';
</script>
</body>
</html>
