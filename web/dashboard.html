<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGEDash Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    font-size: 12px;
    color: #2A2926;
    background: #F4F2EE;
    padding: 12px;
  }

  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #D8D5CE;
  }

  .dashboard-title {
    font-size: 12px;
    font-weight: 600;
    color: #2A2926;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .dashboard-status {
    font-size: 11px;
    color: #8A857C;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .kpi-card {
    background: #FDFCFA;
    border: 1px solid #D8D5CE;
    padding: 12px;
  }

  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    color: #8A857C;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .kpi-value {
    font-size: 22px;
    font-weight: 600;
    color: #2A2926;
    line-height: 1;
    margin-bottom: 4px;
  }

  .kpi-sub {
    font-size: 11px;
    color: #8A857C;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    color: #8A857C;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .info-table {
    width: 100%;
    border-collapse: collapse;
    background: #FDFCFA;
    border: 1px solid #D8D5CE;
  }

  .info-table td {
    padding: 4px 12px;
    border-bottom: 1px solid #E5E2DC;
    font-size: 12px;
  }

  .info-table tr:last-child td {
    border-bottom: none;
  }

  .info-table .label-col {
    color: #5C5850;
    width: 120px;
  }

  .info-table .value-col {
    color: #2A2926;
    font-weight: 400;
  }

  .empty-state {
    display: none;
    text-align: center;
    padding: 32px 16px;
    color: #B0ACA4;
    font-size: 12px;
  }

  .accent-bar {
    display: inline-block;
    width: 3px;
    height: 16px;
    background: #4A6D8C;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>

<div class="dashboard-header">
  <span class="dashboard-title"><span class="accent-bar"></span>Dashboard</span>
  <span class="dashboard-status" id="statusText">Waiting for data...</span>
</div>

<div id="emptyState" class="empty-state">
  No data loaded. Open a file to view the dashboard.
</div>

<div id="mainContent" style="display:none;">
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Rows</div>
      <div class="kpi-value" id="kpiRows">—</div>
      <div class="kpi-sub">data records</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Columns</div>
      <div class="kpi-value" id="kpiCols">—</div>
      <div class="kpi-sub">fields</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">File</div>
      <div class="kpi-value" style="font-size:13px;" id="kpiFile">—</div>
      <div class="kpi-sub">source</div>
    </div>
  </div>

  <div class="section-label">Summary</div>
  <table class="info-table">
    <tr>
      <td class="label-col">File Name</td>
      <td class="value-col" id="infoFileName">—</td>
    </tr>
    <tr>
      <td class="label-col">Total Rows</td>
      <td class="value-col" id="infoRows">—</td>
    </tr>
    <tr>
      <td class="label-col">Total Columns</td>
      <td class="value-col" id="infoCols">—</td>
    </tr>
  </table>
</div>

<script>
  function updateDashboard(payload) {
    var rows = payload.rowCount;
    var cols = payload.colCount;
    var file = payload.fileName || '—';

    document.getElementById('kpiRows').textContent = rows.toLocaleString();
    document.getElementById('kpiCols').textContent = cols.toLocaleString();
    document.getElementById('kpiFile').textContent = file;
    document.getElementById('infoFileName').textContent = file;
    document.getElementById('infoRows').textContent = rows.toLocaleString();
    document.getElementById('infoCols').textContent = cols.toLocaleString();

    document.getElementById('statusText').textContent = 'Data loaded';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
  }

  window.chrome.webview.addEventListener('message', function(e) {
    var msg = JSON.parse(e.data);
    if (msg.type === 'native:ready') {
      window.chrome.webview.postMessage(
        JSON.stringify({ type: 'web:request-summary', version: '1.0', payload: {} })
      );
    } else if (msg.type === 'data:summary') {
      updateDashboard(msg.payload);
    }
  });

  // Show empty state initially
  document.getElementById('emptyState').style.display = 'block';
</script>
</body>
</html>
